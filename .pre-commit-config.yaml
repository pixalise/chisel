minimum_pre_commit_version: "3.0.0"
default_install_hook_types:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: chisel-prettier
        name: Chisel Prettier
        entry: bunx prettier --write --ignore-unknown
        language: system
        files: \.(css|html|js|jsx|json|jsonc|md|mjs|mts|ts|tsx|yaml|yml)$

      - id: chisel-eslint
        name: Chisel ESLint
        entry: bun run lint
        language: system
        pass_filenames: false
        files: \.(js|jsx|mjs|mts|ts|tsx)$
